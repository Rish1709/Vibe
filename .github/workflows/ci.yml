# CI: every push and pull request is linted, type-checked, tested and built, then the Docker images
# are built. CD: on main, the images are published to GitHub Container Registry, tagged with the
# commit SHA (immutable, for rollbacks) and `latest`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run in progress: only the latest commit matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the publish job asks for package writes itself.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Real Redis for rate limiting, caches and BullMQ tests (they use logical database 15).
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # mongodb-memory-server downloads a mongod binary on first use; keep it between runs.
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          REDIS_TEST_URL: redis://localhost:6379/15
      - run: npm run build

  docker:
    name: Docker images
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names
        id: names
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "api=${repo}-api" >> "$GITHUB_OUTPUT"
          echo "web=${repo}-web" >> "$GITHUB_OUTPUT"

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ steps.names.outputs.api }}:${{ github.sha }}
            ${{ steps.names.outputs.api }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Refuse to publish a web image without the real Clerk key
        if: env.PUBLISH == 'true' && vars.VITE_CLERK_PUBLISHABLE_KEY == ''
        run: |
          echo "::error::Set the VITE_CLERK_PUBLISHABLE_KEY repository variable before publishing."
          exit 1

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: ${{ env.PUBLISH == 'true' }}
          # A repository variable (Settings -> Variables). The publishable key is public, not a secret.
          # Pull requests from forks don't see variables, so a placeholder still proves the build.
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_ci_placeholder' }}
          tags: |
            ${{ steps.names.outputs.web }}:${{ github.sha }}
            ${{ steps.names.outputs.web }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
