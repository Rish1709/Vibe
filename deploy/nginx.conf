# Serves the built React app and proxies the API, so the browser sees one origin: no CORS preflights,
# and the Clerk token travels in a header to the same host. The API runs with TRUST_PROXY=1 so rate
# limits use the client address from X-Forwarded-For, not nginx's.

upstream vibe_api {
  server api:4000;
  keepalive 32;
}

# WebSocket upgrades need "Connection: upgrade"; plain requests keep the upstream connection alive.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  client_max_body_size 1m; # JSON only: media goes straight from the browser to ImageKit.

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://vibe_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A little above the API's own 15 s timeout, so the API's 503 reaches the client, not nginx's 504.
    proxy_read_timeout 20s;
  }

  location /health/ {
    proxy_pass http://vibe_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  location /socket.io/ {
    proxy_pass http://vibe_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Sockets are long-lived; Socket.IO pings every 25 s, so idle ones stay well under this.
    proxy_read_timeout 1h;
  }

  # Vite fingerprints asset names (index-3fa9c1.js), so they can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Client-side routes (/explore, /p/:id ...) all load index.html, which must never be cached:
  # it names the current asset files.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri /index.html;
  }
}
